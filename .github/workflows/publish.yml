name: Publish Extension

on:
    push:
    tags:
        - "v*"

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
            uses: actions/checkout@v4

            - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
                node-version: 22
                cache: npm

            - name: Install dependencies
            run: npm ci

            - name: Show Node version
            run: node --version
